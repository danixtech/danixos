name: Build DanixOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27

      - name: Build ISO
        run: |
          nix build .#iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: danixos-iso
          path: result/*
